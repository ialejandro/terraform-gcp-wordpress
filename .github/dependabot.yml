version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
  - enhancement
  - dependency-management
  groups:
    actions-minor-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: terraform
  directories:
  - "/terraform/base-infrastructure"
  - "/terraform/wordpress"
  - "/terraform/wordpress/wordpress-image"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
  - enhancement
  - dependency-management
  groups:
    terraform-minor-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: pip
  directory: "/pipenv"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
  - enhancement
  - dependency-management
  groups:
    pip-minor-patch:
      update-types:
      - minor
      - patch
